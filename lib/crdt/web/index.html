<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPD 2026 / Masters of treedoc-op</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: .5rem 1rem; font-size: .85rem; display: flex; gap: 1.25rem; flex-wrap: wrap;
           border-bottom: 1px solid #8884; }
  header b { font-weight: 600; }
  #dot { width: .6rem; height: .6rem; border-radius: 50%; background: #c33; align-self: center; }
  #dot.on { background: #2a2; }
  textarea { flex: 1; border: 0; padding: 1rem; font: 16px/1.5 ui-monospace, monospace; resize: none;
             outline: none; background: transparent; color: inherit; }
</style>
<header>
  <span id="dot" title="connection"></span>
  <span>node <b id="node">-</b></span>
  <span>peers <b id="peers">-</b></span>
  <span>ops <b id="history">-</b></span>
  <span>waiting <b id="waiting">-</b></span>
  <span id="err"></span>
</header>
<textarea id="ta" spellcheck="false" autofocus></textarea>
<script>
const ta = document.getElementById('ta');
const $ = id => document.getElementById(id);

// helpers
const join = atoms => atoms.map(a => a.ch).join('');

// Smallest changed region between strings a and b
// by UTF-16 unit, never splitting a surrogate pair:
// a[p, aEnd) was replaced by b[p, bEnd).
function diffStr(a, b) {
  const m = Math.min(a.length, b.length);
  let p = 0;
  while (p < m && a.charCodeAt(p) === b.charCodeAt(p)) p++;
  if (p > 0 && isHigh(a.charCodeAt(p - 1))) p--;
  let s = 0;
  while (s < m - p && a.charCodeAt(a.length - 1 - s) === b.charCodeAt(b.length - 1 - s)) s++;
  if (s > 0 && isLow(a.charCodeAt(a.length - s))) s--;
  return { p, aEnd: a.length - s, bEnd: b.length - s };
}
const isHigh = c => c >= 0xd800 && c <= 0xdbff;
const isLow = c => c >= 0xdc00 && c <= 0xdfff;

// The edit the replica expects, addressed by PosID.  `atoms` is what the
// replica last confirmed ([{id, ch}], one per CRDT char); `str` is the text.
// The changed region is widened to whole atoms, because gluing chars together
// (e + combining accent) can re-segment graphemes in the browser.
function editFor(atoms, str) {
  const old = join(atoms);
  const d = diffStr(old, str);
  const off = [0];
  for (const a of atoms) off.push(off[off.length - 1] + a.ch.length);
  let pi = 0;
  while (pi + 1 < off.length && off[pi + 1] <= d.p) pi++; // last atom boundary <= start
  let qi = pi;
  while (off[qi] < d.aEnd) qi++; // first atom boundary >= end
  return {
    del: atoms.slice(pi, qi).map(a => a.id),
    after: pi === 0 ? [] : atoms[pi - 1].id,
    ins: str.slice(off[pi], str.length - (old.length - off[qi]))
  };
}

// The user typed sent -> cur while the replica went sent -> server.
// Replay the typing on top of server.
// If both touched the same region the remote version wins
// (the typed chars of that overlap are dropped).
function rebase(sent, cur, server) {
  const L = diffStr(sent, cur), R = diffStr(sent, server);
  const typed = cur.slice(L.p, L.bEnd);
  if (L.aEnd <= R.p) return server.slice(0, L.p) + typed + server.slice(L.aEnd);
  if (L.p >= R.aEnd) {
    const d = R.bEnd - R.aEnd;
    return server.slice(0, L.p + d) + typed + server.slice(L.aEnd + d);
  }
  return server;
}

// Where a caret at `pos` (UTF-16 units) in oldText lands in newText.
function shiftCaret(oldText, newText, pos) {
  const d = diffStr(oldText, newText);
  if (pos <= d.p) return pos;
  if (pos >= d.aEnd) return pos + (d.bEnd - d.aEnd);
  return d.p;
}

// sync loop
let atoms = [];// [{id, ch}] as last confirmed by the replica
let base = ''; // join(atoms)
let busy = false; // one request in flight at a time
let composing = false;
let fails = 0; // consecutive failed rounds, for the backoff
let timer = null;

const schedule = ms => { clearTimeout(timer); timer = setTimeout(sync, ms); };

async function request(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
  });
  return { ok: r.ok, st: await r.json() };
}

function setText(text) {
  const [s, e] = [ta.selectionStart, ta.selectionEnd];
  const old = ta.value;
  ta.value = text;
  ta.setSelectionRange(shiftCaret(old, text, s), shiftCaret(old, text, e));
}

function showStatus(st) {
  $('node').textContent = st.node ?? '-';
  $('peers').textContent = st.peers ? (st.peers.length ? st.peers.join(', ') : 'none') : '-';
  $('history').textContent = st.history ?? '-';
  $('waiting').textContent = st.waiting ?? '-';
  $('err').textContent = st.error ?? (st.blocked ? 'edits blocked (restart with a new node name)' : '');
}

// Take the replica's reply as the new confirmed state.
function adopt(st, sent, editing) {
  const server = join(st.chars);
  const cur = ta.value;
  if (cur === sent) {// nothing typed meanwhile: replica text wins
    atoms = st.chars; base = server;
    if (cur !== server) setText(server);
  } else if (editing) {// typed during a POST: keep typing on top of the reply
    atoms = st.chars; base = server;
    if (server !== sent) setText(rebase(sent, cur, server));
  } // typed during a GET: stale reply, drop it
}

async function sync() {
  if (busy || composing) return;
  busy = true;
  const sent = ta.value;
  const editing = sent !== base;
  let ok = false;
  try {
    const { ok: good, st } = await request(editing ? '/edit' : '/state',
      editing ? editFor(atoms, sent) : undefined);
    $('dot').classList.add('on');
    showStatus(st);
    if (Array.isArray(st.chars)) adopt(st, sent, editing);
    ok = good;
  } catch (e) {
    $('dot').classList.remove('on');
  } finally {
    busy = false;
    fails = ok ? 0 : fails + 1;
    const unsent = ta.value !== base;
    if (ok) {
      schedule(unsent ? 0 : 400);
    } else {
      const wait = Math.min(400 * 2 ** fails, 5000);
      if (!$('dot').classList.contains('on'))
        $('err').textContent = `offline, retrying in ${Math.round(wait / 1000)} s` +
          (unsent ? ' (unsent edits kept)' : '');
      schedule(wait);
    }
  }
}

ta.addEventListener('input', () => { if (!composing && fails === 0) schedule(0); });
ta.addEventListener('compositionstart', () => { composing = true; });
ta.addEventListener('compositionend', () => { composing = false; schedule(0); });
window.addEventListener('online', () => { fails = 0; schedule(0); });
sync();
</script>
